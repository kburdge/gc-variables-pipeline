# Conda environment for gc-variables-pipeline.
#   conda env create -f environment.yml
#   conda activate gc-variables
#
# REPRODUCIBILITY: JWST calibration is only deterministic if BOTH the pipeline
# version AND the CRDS reference context are pinned. The published reduction
# used jwst calibration 1.17.1 with CRDS context jwst_1322.pmap; both are
# pinned below. The `variables:` section sets the CRDS environment on
# `conda activate` (scripts also refuse to run with an unpinned context —
# see pipeline/config.py apply_crds_env).
name: gc-variables
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - matplotlib
  - h5py
  - astropy
  - photutils
  - astroquery>=0.4.7   # MAST download (needs flat=True download support)
  - pyyaml
  - pip:
      - jwst==1.17.1    # STScI calibration pipeline (pulls crds, stcal, etc.)
      # - cupy-cuda12x  # OPTIONAL: only for the GPU every-pixel transit search
variables:
  CRDS_PATH: ${HOME}/crds_cache
  CRDS_SERVER_URL: https://jwst-crds.stsci.edu
  CRDS_CONTEXT: jwst_1322.pmap
