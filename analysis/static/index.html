<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Variable Star Catalog</title>
    <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; }

        #container { display: flex; height: 100vh; }

        /* Left sidebar: image layers */
        #left-sidebar {
            flex: 0 0 140px; background: #0d1117; border-right: 1px solid #30363d;
            overflow-y: auto; padding: 6px;
        }
        #left-sidebar h3 { font-size: 11px; color: #8b949e; margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .img-btn {
            display: block; width: 100%; padding: 6px 8px; margin: 2px 0;
            background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
            border-radius: 4px; font-size: 11px; cursor: pointer; text-align: left;
        }
        .img-btn:hover { border-color: #58a6ff; background: #1c2128; }
        .img-btn.active { border-color: #f0883e; background: #1c2128; color: #f0883e; }
        #left-sidebar select {
            width: 100%; background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
            padding: 4px; border-radius: 4px; font-size: 11px; margin: 4px 0;
        }

        /* Center: sky viewer */
        #sky-panel { flex: 1; position: relative; }
        #aladin-lite-div { width: 100%; height: 100%; }

        #loading-indicator {
            position: absolute; bottom: 10px; left: 10px; z-index: 200;
            background: rgba(13,17,23,0.85); padding: 6px 12px; border-radius: 4px;
            font-size: 12px; color: #58a6ff; display: none;
            border: 1px solid #30363d;
        }
        #cluster-badge {
            position: absolute; top: 10px; left: 10px; z-index: 200;
            background: rgba(13,17,23,0.85); padding: 6px 14px; border-radius: 6px;
            font-size: 14px; font-weight: 600; color: #f0883e;
            border: 1px solid #30363d; backdrop-filter: blur(4px);
        }
        #cluster-badge .count { color: #8b949e; font-weight: 400; font-size: 12px; }

        /* Right sidebar: catalogs */
        #cat-sidebar {
            position: absolute; top: 40%; right: 10px; z-index: 200;
            background: rgba(13,17,23,0.85); padding: 12px 16px; border-radius: 6px;
            border: 1px solid #30363d; backdrop-filter: blur(4px);
            min-width: 140px;
        }
        #cat-sidebar h3 { font-size: 13px; color: #8b949e; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .cat-toggle {
            display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; cursor: pointer;
        }
        .cat-toggle input { cursor: pointer; width: 14px; height: 14px; }
        .cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        /* Right: info + lightcurves */
        #right-panel {
            flex: 1; display: flex; flex-direction: column;
            padding: 10px; gap: 6px; overflow: hidden;
        }
        #source-info {
            background: #161b22; border: 1px solid #30363d; border-radius: 6px;
            padding: 10px 14px; font-size: 13px; line-height: 1.6;
            min-height: 60px;
        }
        #source-info .label { color: #8b949e; }
        #source-info .value { color: #58a6ff; font-weight: 600; }
        #source-info .highlight { color: #f0883e; }

        #lc-panels { flex: 1; display: grid; gap: 6px; min-height: 0; overflow-y: auto; }
        #lc-panels.grid-2x4 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); }
        #lc-panels.grid-2x2 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, 1fr); }
        #lc-panels.grid-1col { grid-template-columns: 1fr; }
        .lc-container {
            background: #161b22;
            border: 1px solid #30363d; border-radius: 6px;
            min-height: 0;
        }
        .lc-container .placeholder {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #484f58; font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Left sidebar: image layers -->
        <div id="left-sidebar">
            <label style="font-size:11px;color:#8b949e;">Cluster</label>
            <select id="cluster-select"></select>
            <label style="font-size:11px;color:#8b949e;">Segment</label>
            <select id="seg-select"></select>
            <label style="font-size:11px;color:#8b949e;">Sources</label>
            <select id="src-select">
                <option value="all">All</option>
                <option value="ramp">Ramp only</option>
                <option value="zf">ZF only</option>
                <option value="master" selected>Master (merged)</option>
            </select>
            <h3>SW Ramp</h3>
            <button class="img-btn active" data-img="i2d">Direct (i2d)</button>
            <button class="img-btn" data-img="autocorr">Autocorrelation</button>
            <h3>LW Ramp</h3>
            <button class="img-btn" data-img="lw_i2d">Direct (i2d)</button>
            <button class="img-btn" data-img="lw_autocorr">Autocorrelation</button>
            <h3>SW Zeroframe</h3>
            <button class="img-btn" data-img="zf_median">Median</button>
            <button class="img-btn" data-img="zf_autocorr">Autocorrelation</button>
            <h3>LW Zeroframe</h3>
            <button class="img-btn" data-img="lw_zf_median">Median</button>
            <button class="img-btn" data-img="lw_zf_autocorr">Autocorrelation</button>
        </div>

        <!-- Center: sky viewer -->
        <div id="sky-panel">
            <div id="aladin-lite-div"></div>
            <div id="cluster-badge"></div>
            <div id="cat-sidebar">
                <h3>Catalogues</h3>
                <label class="cat-toggle"><input type="checkbox" id="cat-simbad"><span class="cat-dot" style="background:#e6194b"></span> SIMBAD</label>
                <label class="cat-toggle"><input type="checkbox" id="cat-chandra"><span class="cat-dot" style="background:#42d4f4"></span> Chandra 2.1</label>
                <label class="cat-toggle"><input type="checkbox" id="cat-gaia"><span class="cat-dot" style="background:#3cb44b"></span> Gaia DR3</label>
            </div>
            <div id="loading-indicator">Loading FITS...</div>
        </div>
        <div id="right-panel">
            <div id="source-info">
                <span class="label">Click a source marker to view lightcurves</span>
            </div>
            <div id="lc-panels"></div>
        </div>
    </div>

<script>
// ─── State ──────────────────────────────────────────────────
let aladin;
let rampCatalog;
let zfCatalog;
let allSources = [];
let targetsInfo = {};
let currentTarget = null;
let currentSeg = null;
let currentImg = 'i2d';
let currentSrcFilter = 'master';
let currentPosMode = 'best';
let selectedSourceId = null;

// ─── Plotly dark theme ──────────────────────────────────────
const plotLayout = {
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#0d1117',
    font: { color: '#c9d1d9', size: 11 },
    margin: { l: 55, r: 10, t: 28, b: 36 },
    xaxis: {
        title: { text: 'Time (hr)', font: { size: 11 } },
        gridcolor: '#21262d', zerolinecolor: '#30363d',
        tickfont: { size: 10 },
    },
    yaxis: {
        title: { text: 'Flux (ADU)', font: { size: 11 } },
        gridcolor: '#21262d', zerolinecolor: '#30363d',
        tickfont: { size: 10 },
    },
    showlegend: false,
};

const plotConfig = { responsive: true, displayModeBar: false };

// ─── Initialize ─────────────────────────────────────────────
A.init.then(async () => {
    aladin = A.aladin('#aladin-lite-div', {
        target: '263.337 -33.398',
        fov: 0.05,
        cooFrame: 'J2000',
        showCooGridControl: true,
        showSettingsControl: true,
        showShareControl: false,
        showFullscreenControl: true,
        reticleColor: '#ff6b6b',
        reticleSize: 18,
    });

    // Load target metadata
    const resp = await fetch('api/targets');
    targetsInfo = await resp.json();
    const targetNames = Object.keys(targetsInfo);

    // Populate cluster selector
    const clusterSel = document.getElementById('cluster-select');
    for (const name of targetNames) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        clusterSel.appendChild(opt);
    }

    // Wire up controls
    clusterSel.addEventListener('change', (e) => switchTarget(e.target.value));
    document.getElementById('seg-select').addEventListener('change', (e) => {
        currentSeg = e.target.value;
        loadFITS(currentSeg, currentImg);
    });
    document.getElementById('src-select').addEventListener('change', (e) => {
        currentSrcFilter = e.target.value;
        filterSources(currentSrcFilter);
    });

    // Image layer buttons
    document.querySelectorAll('.img-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.img-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentImg = btn.dataset.img;
            loadFITS(currentSeg, currentImg);
        });
    });

    document.getElementById('cat-simbad').addEventListener('change', (e) => {
        if (window._extCats && window._extCats.simbad) e.target.checked ? window._extCats.simbad.show() : window._extCats.simbad.hide();
    });
    document.getElementById('cat-chandra').addEventListener('change', (e) => {
        if (window._extCats && window._extCats.chandra) e.target.checked ? window._extCats.chandra.show() : window._extCats.chandra.hide();
    });
    document.getElementById('cat-gaia').addEventListener('change', (e) => {
        if (window._extCats && window._extCats.gaia) e.target.checked ? window._extCats.gaia.show() : window._extCats.gaia.hide();
    });

    // Load first target
    switchTarget(targetNames[0]);
});

// ─── Switch target cluster ──────────────────────────────────
async function switchTarget(target) {
    currentTarget = target;
    const info = targetsInfo[target];
    window._initialCentered = false;
    selectedSourceId = null;

    // Update badge
    document.getElementById('cluster-badge').innerHTML =
        `${target} <span class="count">${info.n_sources} sources (${info.n_ramp} ramp, ${info.n_zf} ZF)</span>`;

    // Update segment selector
    const segSel = document.getElementById('seg-select');
    segSel.innerHTML = '';
    for (const seg of info.segments) {
        const opt = document.createElement('option');
        opt.value = seg;
        const shortName = seg.replace('Segment', 'Seg ');
        opt.textContent = shortName;
        segSel.appendChild(opt);
    }
    currentSeg = info.segments[0];

    currentPosMode = 'best';

    // Build lightcurve panel containers
    buildLCPanels(info.segments);

    // Reset source info
    document.getElementById('source-info').innerHTML =
        '<span class="label">Click a source marker to view lightcurves</span>';

    // Go to target center
    const [ra, dec] = info.center.split(' ').map(Number);
    aladin.gotoRaDec(ra, dec);

    // Load variable star sources first (this calls removeLayers)
    await loadSources();
    filterSources(currentSrcFilter);

    // Load FITS image first, then external catalogs after a delay
    loadFITS(currentSeg, currentImg);
    setTimeout(() => loadExternalCatalogs(ra, dec), 1000);
}

// ─── Build lightcurve panel divs dynamically ────────────────
function buildLCPanels(segments) {
    const container = document.getElementById('lc-panels');
    container.innerHTML = '<div class="lc-container"><div class="placeholder">Click a source marker to view lightcurves</div></div>';
}

// ─── Get source position for current mode ───────────────────
function getSourceRA(s) {
    if (currentPosMode === 'seg3' && s.seg3_ra !== undefined) return s.seg3_ra;
    if (currentPosMode === 'seg4' && s.seg4_ra !== undefined) return s.seg4_ra;
    return s.ra;
}
// ─── External catalog loading (global scope) ────────────────
window._extCats = {};

function loadExternalCatalogs(ra, dec) {
    for (const key in window._extCats) {
        try { window._extCats[key].hide(); } catch(e) {}
    }
    window._extCats = {};

    const radius = 0.1;
    const pos = `${ra} ${dec}`;
    console.log('loadExternalCatalogs:', pos, radius);

    try {
        const simbad = A.catalogFromSimbad(pos, radius, {
            onClick: 'showPopup', color: '#e6194b', sourceSize: 12, shape: 'plus', name: 'SIMBAD'
        });
        console.log('SIMBAD returned:', simbad);
        aladin.addCatalog(simbad);
        window._extCats.simbad = simbad;
    } catch(e) { console.error('SIMBAD:', e); }

    try {
        const chandra = A.catalogFromVizieR('IX/70/csc21mas', pos, radius, {
            onClick: 'showPopup', color: '#42d4f4', sourceSize: 14, shape: 'cross', name: 'Chandra 2.1'
        });
        console.log('Chandra returned:', chandra);
        aladin.addCatalog(chandra);
        window._extCats.chandra = chandra;
    } catch(e) { console.error('Chandra:', e); }

    try {
        const gaia = A.catalogFromVizieR('I/355/gaiadr3', pos, radius, {
            onClick: 'showPopup', color: '#3cb44b', sourceSize: 8, name: 'Gaia DR3'
        });
        console.log('Gaia returned:', gaia);
        aladin.addCatalog(gaia);
        window._extCats.gaia = gaia;
    } catch(e) { console.error('Gaia:', e); }

    setTimeout(() => {
        try {
            if (!document.getElementById('cat-simbad').checked && window._extCats.simbad) window._extCats.simbad.hide();
            if (!document.getElementById('cat-chandra').checked && window._extCats.chandra) window._extCats.chandra.hide();
            if (!document.getElementById('cat-gaia').checked && window._extCats.gaia) window._extCats.gaia.hide();
        } catch(e) {}
    }, 3000);
}

function getSourceDec(s) {
    if (currentPosMode === 'seg3' && s.seg3_dec !== undefined) return s.seg3_dec;
    if (currentPosMode === 'seg4' && s.seg4_dec !== undefined) return s.seg4_dec;
    return s.dec;
}

// ─── Load source catalog ────────────────────────────────────
let masterSources = [];
let useMaster = false;

async function loadSources() {
    const resp = await fetch(`api/${currentTarget}/sources`);
    allSources = await resp.json();
    console.log(`Loaded ${allSources.length} sources for ${currentTarget}`);

    // Also load master catalog
    try {
        const mresp = await fetch(`api/master/${currentTarget}/sources`);
        if (mresp.ok) {
            masterSources = await mresp.json();
            console.log(`Loaded ${masterSources.length} master sources for ${currentTarget}`);
        }
    } catch(e) { masterSources = []; }

    buildCatalogs();
}

function buildCatalogs() {
    // Remove old catalogs
    aladin.removeLayers();
    masterCatalog = null;

    rampCatalog = A.catalog({
        name: 'Ramp',
        sourceSize: 14,
        color: '#ff3333',
        shape: 'square',
        onClick: 'showPopup',
    });
    zfCatalog = A.catalog({
        name: 'ZF',
        sourceSize: 12,
        color: '#33aaff',
        shape: 'circle',
        onClick: 'showPopup',
    });
    aladin.addCatalog(rampCatalog);
    aladin.addCatalog(zfCatalog);

    populateCatalogs();

    aladin.on('objectClicked', (object) => {
        if (object && object.data && object.data.id !== undefined) {
            selectSource(object.data.id);
        }
    });
}

function populateCatalogs() {
    const makeSource = (s) => A.source(getSourceRA(s), getSourceDec(s), {
        id: s.id,
        name: `src${s.id} (${s.det})`,
        Detector: s.det,
        Type: s.type,
        Detection: s.dtype,
        'Period (min)': s.period,
        'LS sig': s.ls_sig,
        Amplitude: s.amp,
        Autocorr: s.autocorr,
    });

    rampCatalog.addSources(allSources.filter(s => s.type === 'ramp').map(makeSource));
    zfCatalog.addSources(allSources.filter(s => s.type === 'zf').map(makeSource));
}

function rebuildCatalogs() {
    buildCatalogs();
    filterSources(currentSrcFilter);
    console.log(`Rebuilt catalogs with position mode: ${currentPosMode}`);
}

// ─── Load FITS mosaic ───────────────────────────────────────
function loadFITS(seg, imgtype) {
    const indicator = document.getElementById('loading-indicator');
    indicator.style.display = 'block';
    indicator.textContent = `Loading ${currentTarget} ${seg} ${imgtype}...`;

    const url = `fits/mosaic/${currentTarget}/${seg}/${imgtype}?t=${Date.now()}`;
    console.log(`Fetching FITS: ${url}`);
    aladin.displayFITS(url, {}, (ra, dec, fov, image) => {
        if (imgtype.includes('autocorr')) {
            image.setColormap('magma', { stretch: 'linear' });
        } else if (imgtype.includes('zf_median')) {
            image.setColormap('grayscale', { stretch: 'asinh' });
        } else {
            image.setColormap('grayscale', { stretch: 'asinh' });
        }
        if (!window._initialCentered) {
            aladin.gotoRaDec(ra, dec);
            aladin.setFoV(fov * 1.8);
            window._initialCentered = true;
        }
        indicator.style.display = 'none';
        console.log(`Loaded ${currentTarget} ${seg} ${imgtype} (${fov.toFixed(4)} deg)`);
    }, (err) => {
        indicator.textContent = `Error loading ${imgtype}: ${err}`;
        console.error(`FITS load error for ${url}:`, err);
    });
}

// ─── Filter source catalogs by type ─────────────────────────
let masterCatalog = null;

function filterSources(filter) {
    useMaster = (filter === 'master');

    if (useMaster) {
        rampCatalog.hide();
        zfCatalog.hide();
        // Build master overlay if not yet
        if (!masterCatalog) {
            masterCatalog = A.catalog({
                name: 'Master',
                sourceSize: 14,
                color: '#f0883e',
                shape: 'diamond',
                onClick: 'showPopup',
            });
            aladin.addCatalog(masterCatalog);
            const makeSrc = (s, i) => A.source(s.ra, s.dec, {
                id: i,
                name: `obj${s.id} (n=${s.n_det})`,
                'Master ID': s.id,
                'Best SNR': s.snr,
                'N detections': s.n_det,
            });
            masterCatalog.addSources(masterSources.map((s, i) => makeSrc(s, i)));
        }
        masterCatalog.show();

        document.getElementById('cluster-badge').innerHTML =
            `${currentTarget} <span class="count">Master: ${masterSources.length} unique objects</span>`;
    } else {
        if (masterCatalog) masterCatalog.hide();
        if (filter === 'all' || filter === 'ramp') { rampCatalog.show(); } else { rampCatalog.hide(); }
        if (filter === 'all' || filter === 'zf') { zfCatalog.show(); } else { zfCatalog.hide(); }

        const info = targetsInfo[currentTarget];
        document.getElementById('cluster-badge').innerHTML =
            `${currentTarget} <span class="count">${info.n_sources} sources (${info.n_ramp} ramp, ${info.n_zf} ZF)</span>`;
    }
}

// ─── Select source and load lightcurves ─────────────────────
async function selectSource(sourceId) {
    selectedSourceId = sourceId;
    const infoDiv = document.getElementById('source-info');
    infoDiv.innerHTML = '<span class="label">Loading...</span>';

    try {
        const apiUrl = useMaster
            ? `api/master/${currentTarget}/lightcurve/${sourceId}`
            : `api/${currentTarget}/lightcurve/${sourceId}`;
        const resp = await fetch(apiUrl);
        const data = await resp.json();
        showSourceInfo(data);
        plotAllLightcurves(data);
    } catch (err) {
        infoDiv.innerHTML = `<span style="color:#f85149">Error: ${err.message}</span>`;
    }
}

function showSourceInfo(data) {
    const infoDiv = document.getElementById('source-info');

    if (useMaster) {
        infoDiv.innerHTML = `
            <span class="value">Object ${data.id}</span>
            <span class="highlight"> | ${data.n_det} detections</span>
            <span class="label"> | best SNR=${data.snr}</span><br>
            <span class="label">RA=</span><span class="value">${data.ra.toFixed(6)}</span>
            <span class="label"> Dec=</span><span class="value">${data.dec.toFixed(6)}</span>
        `;
        return;
    }

    const info = targetsInfo[currentTarget];
    const srcType = data.type || '';
    const dtype = data.dtype || '';
    const det = data.det || '';
    infoDiv.innerHTML = `
        <span class="value">Source ${data.id}</span>
        <span class="label"> | ${det} | ${srcType.toUpperCase()}</span>
        <span class="highlight"> | ${dtype}</span><br>
        <span class="label">RA=</span><span class="value">${data.ra.toFixed(6)}</span>
        <span class="label"> Dec=</span><span class="value">${data.dec.toFixed(6)}</span>
        <span class="label"> | P=</span><span class="value">${data.period || ''}</span><span class="label">min</span>
        <span class="label"> | LS=</span><span class="value">${data.ls_sig || ''}</span>
        <span class="label"> | amp=</span><span class="value">${data.amp || ''}</span>
        <span class="label"> | SNR=</span><span class="value">${data.snr || data.autocorr || ''}</span>
    `;
}

// ─── Plot lightcurves ───────────────────────────────────────
function plotAllLightcurves(data) {
    const container = document.getElementById('lc-panels');
    container.innerHTML = '';

    const allKeys = Object.keys(data.lcs);
    if (allKeys.length === 0) {
        container.className = 'grid-1col';
        container.innerHTML = '<div class="lc-container"><div class="placeholder">No lightcurve data</div></div>';
        return;
    }

    // Split into SW (nrcb1-4) and LW (nrcblong) keys
    const swKeys = allKeys.filter(k => !k.includes('nrcblong')).sort();
    const lwKeys = allKeys.filter(k => k.includes('nrcblong')).sort();

    // Determine grid: pair SW and LW by segment/mode
    // Build ordered pairs: [swKey, lwKey] for each row
    const rows = [];
    const swBySegMode = {};
    const lwBySegMode = {};

    for (const k of swKeys) {
        // key format: Segment3_ramp_sw_nrcb1 or Segment3_ramp_nrcb1
        const parts = k.split('_');
        const seg = parts[0]; // Segment3
        const mode = parts[1]; // ramp or zf
        const segMode = `${seg}_${mode}`;
        if (!swBySegMode[segMode]) swBySegMode[segMode] = [];
        swBySegMode[segMode].push(k);
    }
    for (const k of lwKeys) {
        const parts = k.split('_');
        const seg = parts[0];
        const mode = parts[1];
        const segMode = `${seg}_${mode}`;
        lwBySegMode[segMode] = k;
    }

    // For each segment/mode combo, pick the best SW key (detected first, then highest det name)
    // and pair with the LW key
    const segModes = [...new Set([...Object.keys(swBySegMode), ...Object.keys(lwBySegMode)])].sort();
    for (const sm of segModes) {
        const sw = swBySegMode[sm];
        const lw = lwBySegMode[sm];
        // Pick best SW: prefer detected, then first alphabetically
        let bestSw = null;
        if (sw && sw.length > 0) {
            const detected = sw.find(k => data.lcs[k].detected);
            bestSw = detected || sw[0];
        }
        rows.push([bestSw, lw || null]);
    }

    const nRows = rows.length;
    if (nRows <= 2) {
        container.className = 'grid-2x2';
    } else {
        container.className = 'grid-2x4';
    }

    // Flatten: left column (SW) then right column (LW), row by row
    for (const [swKey, lwKey] of rows) {
        plotOnePanel(container, swKey, data, 'SW');
        plotOnePanel(container, lwKey, data, 'LW');
    }
}

function plotOnePanel(container, key, data, channelLabel) {
    const div = document.createElement('div');
    div.className = 'lc-container';
    container.appendChild(div);

    if (!key || !data.lcs[key]) {
        div.innerHTML = `<div class="placeholder">${channelLabel} — no data</div>`;
        return;
    }

    const lc = data.lcs[key];
    const detLabel = lc.detected ? 'DETECTED' : 'forced';
    // Shorten key for title
    const shortKey = key.replace('Segment', 'S').replace('nrcblong', 'LW').replace(/nrcb\d/, 'SW');
    const title = `${shortKey} (${detLabel}) | N=${lc.n}`;

    const lineColor = lc.detected ? '#f47067' : '#58a6ff';

    const traces = [
        {
            x: lc.t, y: lc.f,
            mode: 'markers',
            marker: { size: 2.5, color: '#8b949e', opacity: 0.6 },
            name: 'cleaned',
            hoverinfo: 'x+y',
        },
        {
            x: lc.tb, y: lc.fb,
            mode: 'lines',
            line: { color: lineColor, width: 2 },
            name: 'binned',
            hoverinfo: 'x+y',
        },
    ];

    const fMin = Math.min(...lc.f);
    const fMax = Math.max(...lc.f);
    const fRange = fMax - fMin || 1;
    const yPad = fRange * 0.1;

    const layout = {
        ...plotLayout,
        title: { text: title, font: { size: 10, color: '#8b949e' } },
        margin: { l: 50, r: 5, t: 22, b: 28 },
        yaxis: {
            ...plotLayout.yaxis,
            range: [fMin - yPad, fMax + yPad],
        },
    };

    Plotly.newPlot(div, traces, layout, plotConfig);
}

// ─── Keyboard shortcuts ─────────────────────────────────────
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;

    const info = targetsInfo[currentTarget];
    if (!info) return;

    // Number keys for segment switching
    if (e.key >= '1' && e.key <= '9') {
        const segNum = `Segment${e.key}`;
        if (info.segments.includes(segNum)) {
            document.getElementById('seg-select').value = segNum;
            currentSeg = segNum;
            loadFITS(currentSeg, currentImg);
        }
    } else if (e.key === 'i') {
        const sel = document.getElementById('img-select');
        currentImg = currentImg === 'autocorr' ? 'i2d' : 'autocorr';
        sel.value = currentImg;
        loadFITS(currentSeg, currentImg);
    } else if (e.key === 's') {
        const sel = document.getElementById('src-select');
        const cycle = { all: 'ramp', ramp: 'zf', zf: 'all' };
        currentSrcFilter = cycle[currentSrcFilter];
        sel.value = currentSrcFilter;
        filterSources(currentSrcFilter);
    } else if (e.key === 'p') {
        // Only cycle positions if multi-segment
        if (info.segments.length > 1) {
            const sel = document.getElementById('pos-select');
            const opts = Array.from(sel.options).map(o => o.value);
            const idx = (opts.indexOf(currentPosMode) + 1) % opts.length;
            currentPosMode = opts[idx];
            sel.value = currentPosMode;
            rebuildCatalogs();
        }
    } else if (e.key === 'c') {
        // Cycle through clusters
        const names = Object.keys(targetsInfo);
        const idx = (names.indexOf(currentTarget) + 1) % names.length;
        document.getElementById('cluster-select').value = names[idx];
        switchTarget(names[idx]);
    }
});
</script>
